<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tracker Pro | Health Dashboard</title>
    <script src="https://cloudflare.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #3b82f6; --water: #0ea5e9; --calorie: #ef4444; --sleep: #6366f1; --bmi: #10b981; --share: #8b5cf6; --bg: #f1f5f9; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .app-card { max-width: 550px; margin: 0 auto; background: white; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 25px; }
        .input-section { margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
        
        .dashboard-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .summary-card { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 20px; border-radius: 20px; text-align: center; }
        .live-ticking-card { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 20px; text-align: center; font-family: monospace; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-track { padding: 15px; border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .panel { display: none; background: #f8fafc; padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid #ddd; }
        .save-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; margin-top: 10px; cursor: pointer; }

        #share-card { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 25px; border-radius: 20px; text-align: center; display: none; margin-top: 20px; }
        .card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 0.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <h2 style="text-align: center; color: var(--primary);">Life Tracker Pro</h2>
    <div class="input-section">
        <input type="text" id="u-name" placeholder="Full Name" oninput="localStorage.setItem('uName', this.value)">
        <label style="font-size: 0.8rem; font-weight: bold; color: #666;">BIRTH DATE & TIME</label>
        <input type="datetime-local" id="dob" onchange="initApp()">
    </div>

    <div id="dashboard" class="hidden">
        <div class="dashboard-container">
            <div class="summary-card">
                <div id="age-summary" style="font-size: 1.4rem; font-weight: 800;"></div>
                <div id="bday-countdown" style="font-size: 0.8rem; margin-top: 5px;"></div>
            </div>
            <div class="live-ticking-card"><div id="live-counter"></div></div>
        </div>

        <div class="action-grid">
            <button class="btn-track" style="background:var(--bmi)" onclick="togglePanel('bmi-panel')">⚖️ BMI</button>
            <button class="btn-track" style="background:var(--water)" onclick="togglePanel('water-panel')">💧 Water</button>
            <button class="btn-track" style="background:var(--calorie)" onclick="handleCalorieClick()">🔥 Calories</button>
            <button class="btn-track" style="background:var(--sleep)" onclick="togglePanel('sleep-panel')">😴 Sleep</button>
            <button class="btn-track" style="background:var(--share); grid-column: span 2;" onclick="prepareShareCard()">📸 Create Life Card</button>
        </div>

        <!-- Panels -->
        <div id="bmi-panel" class="panel">
            <input type="number" id="w-val" placeholder="Weight (kg)">
            <input type="number" id="h-val" placeholder="Height (cm)">
            <button onclick="calcBMI()" class="save-btn" style="background:var(--bmi)">Calculate</button>
            <div id="bmi-res" style="text-align:center; margin-top:10px;"></div>
        </div>

        <div id="water-panel" class="panel">
            <p id="water-text" style="font-weight:bold; text-align:center;">0 / 3000 ml</p>
            <button onclick="addWater(250)" class="save-btn" style="background:var(--water)">+ Add Glass</button>
        </div>

        <div id="calorie-panel" class="panel"><div id="cal-info"></div></div>

        <div id="sleep-panel" class="panel">
            <input type="time" id="wake-time" value="07:00">
            <button onclick="calcSleep()" class="save-btn" style="background:var(--sleep)">Plan Sleep</button>
            <div id="sleep-res" style="margin-top:10px;"></div>
        </div>

        <div id="share-card">
            <div id="card-age" style="font-size: 1.8rem; font-weight: 800;"></div>
            <div class="card-stats">
                <div id="c-heart"></div>
                <div id="c-breath"></div>
            </div>
        </div>
        <div id="share-controls" class="hidden">
            <button onclick="downloadCard()" class="save-btn" style="background:#10b981">Download Image</button>
        </div>

        <button onclick="confirmReset()" style="width:100%; background:none; border:none; color:red; cursor:pointer; margin-top:20px; text-decoration:underline;">Reset All Data</button>
    </div>
</div>

<script>
    let timer;
    let waterIn = parseInt(localStorage.getItem('waterIn')) || 0;

    window.onload = function() {
        const savedDob = localStorage.getItem('uDob');
        const savedName = localStorage.getItem('uName');
        if(savedName) document.getElementById('u-name').value = savedName;
        if(savedDob) {
            document.getElementById('dob').value = savedDob;
            initApp();
        }
    };

    function initApp() {
        const dobVal = document.getElementById('dob').value;
        if(!dobVal) return;
        
        localStorage.setItem('uDob', dobVal);
        document.getElementById('dashboard').classList.remove('hidden');
        
        if(timer) clearInterval(timer);
        update();
        timer = setInterval(update, 1000);
    }

    function update() {
        const dob = new Date(document.getElementById('dob').value);
        const now = new Date();
        
        if(isNaN(dob)) return;

        let y = now.getFullYear() - dob.getFullYear();
        let m = now.getMonth() - dob.getMonth();
        let d = now.getDate() - dob.getDate();
        let h = now.getHours() - dob.getHours();
        let mi = now.getMinutes() - dob.getMinutes();
        let s = now.getSeconds() - dob.getSeconds();

        if(s < 0) { s += 60; mi--; }
        if(mi < 0) { mi += 60; h--; }
        if(h < 0) { h += 24; d--; }
        if(d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
        if(m < 0) { y--; m += 12; }

        document.getElementById('age-summary').innerText = `${y}Y, ${m}M, ${d}D`;
        document.getElementById('live-counter').innerText = `${y}y : ${m}m : ${d}d : ${h}h : ${mi}m : ${s}s`;

        let next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
        if(now > next) next.setFullYear(now.getFullYear() + 1);
        document.getElementById('bday-countdown').innerText = `Next Birthday: ${Math.ceil((next-now)/86400000)} days left`;
    }

    function togglePanel(id) {
        const p = document.getElementById(id);
        const isVisible = p.style.display === 'block';
        document.querySelectorAll('.panel').forEach(el => el.style.display = 'none');
        p.style.display = isVisible ? 'none' : 'block';
    }

    function handleCalorieClick() {
        if(!document.getElementById('w-val').value) {
            alert("Fill BMI first!");
            togglePanel('bmi-panel');
        } else {
            togglePanel('calorie-panel');
            calcBMI();
        }
    }

    function calcBMI() {
        const w = document.getElementById('w-val').value;
        const h = document.getElementById('h-val').value;
        if(!w || !h) return;
        const bmi = (w / ((h/100)*(h/100))).toFixed(1);
        document.getElementById('bmi-res').innerHTML = `BMI: <b>${bmi}</b>`;
        document.getElementById('cal-info').innerHTML = `Goal: <b>${Math.round(bmi * 140)}</b> kcal/day`;
    }

    function addWater(ml) {
        waterIn += ml;
        localStorage.setItem('waterIn', waterIn);
        document.getElementById('water-text').innerText = `${waterIn} / 3000 ml`;
    }

    function calcSleep() {
        const t = document.getElementById('wake-time').value;
        document.getElementById('sleep-res').innerText = "Try to sleep 7.5 or 9 hours before " + t;
    }

    function prepareShareCard() {
        document.getElementById('card-age').innerText = document.getElementById('age-summary').innerText;
        document.getElementById('share-card').style.display = 'block';
        document.getElementById('share-controls').classList.remove('hidden');
    }

    function downloadCard() {
        html2canvas(document.getElementById('share-card')).then(canvas => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL();
            a.download = 'LifeCard.png';
            a.click();
        });
    }

    function confirmReset() {
        if(confirm("Clear all data?")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>

</body>
</html>
